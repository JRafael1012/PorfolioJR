<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#03071e" />
    <title>Página no encontrada — Rafael.dev</title>
    <link rel="icon" href="/PorfolioJR/favicon.png" type="image/png" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", sans-serif;
        background: #03071e;
        color: #f5f2e9;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 42%, rgb(255 186 8 / 9%), transparent 48%),
          linear-gradient(135deg, #03071e, #090d20 55%, #03071e);
      }

      main {
        width: min(100%, 38rem);
        padding: clamp(2rem, 7vw, 4.5rem);
        border: 1px solid rgb(255 186 8 / 28%);
        background: rgb(9 13 32 / 78%);
        box-shadow: 0 32px 100px rgb(0 0 0 / 38%);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 1.2rem;
        color: #ffba08;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(4.5rem, 18vw, 8rem);
        font-weight: 800;
        letter-spacing: -0.09em;
        line-height: 0.9;
      }

      h1 span {
        color: #ffba08;
      }

      .message {
        margin: 1.8rem 0 2rem;
        color: #b7bbc9;
        font-size: 1rem;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        padding: 0.75rem 1.2rem;
        border: 1px solid #ffba08;
        background: #ffba08;
        color: #17130a;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        transition: background-color 180ms ease, transform 180ms ease;
      }

      a:hover {
        transform: translateY(-2px);
        background: #ffd05a;
      }

      a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Rafael.dev · Error 404</p>
      <h1>4<span>0</span>4</h1>
      <p class="message">
        Esta página no está por aquí. Puede que el enlace haya cambiado,
        pero todavía puedes volver al portafolio.
      </p>
      <a href="/PorfolioJR/">Volver al inicio <span aria-hidden="true">→</span></a>
    </main>
  </body>
</html>
